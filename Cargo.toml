[package]
name = "regressify"
version = "2.0.14"
edition = "2024"
license = "AGPL-3.0-or-later"
default-run = "regressify"

[[bin]]
name = "regressify-desktop"
path = "src/bin/desktop.rs"
required-features = ["gui"]

[[test]]
name = "desktop_worker"
path = "tests/desktop_worker.rs"
required-features = ["gui"]

[features]
default = ["local"]
local = []
cloud = []
desktop = ["local", "dep:yaml-edit", "dep:command-group", "dep:saphyr-parser", "dep:tree-sitter", "dep:tree-sitter-yaml", "dep:tree-sitter-json", "dep:windows-sys", "dep:keyring", "dep:zeroize", "dep:imagequant", "dep:jsonschema", "dep:strsim", "dep:sha1", "dep:tiny_http", "dep:similar"]
gui = ["desktop", "dep:gpui-kit", "dep:rfd", "dep:open", "dep:lsp-types", "dep:windows", "dep:webbrowser", "dep:raw-window-handle"]
gui-tests = ["gui", "gpui-kit/test-support"]

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
chromiumoxide = { version = "0.9.1", features = ["bytes", "fetcher", "rustls", "zip8" ] }
chrono = "0.4.26"
clap = { version = "4", features = ["derive"] }
colored = "3.0.0"
command-group = { version = "5", optional = true }
deunicode = "1.6.2"
directories = "6"
futures = "0.3.31"
glob = "0.3.3"
globset = "0.4"
gpui-kit = { version = "=0.8.0", optional = true, features = ["tree-sitter-yaml"] }
image = { version = "0.25", default-features = false, features = ["png"] }
imagequant = { version = "4.4", optional = true }
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }
jsonschema = { version = "0.57", default-features = false, optional = true }
keyring = { version = "3.6.3", optional = true, features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust", "vendored"] }
lodepng = "3.12.1"
lsp-types = { version = "0.97", optional = true }
oxipng = "10.0.0"
open = { version = "5", optional = true }
percent-encoding = "2"
posthog-rs = { version = "0.27", default-features = false, features = ["async-client"] }
pulldown-cmark = "0.13.0"
rayon = "1.11.0"
regex = "1"
reqwest = { version = "0.12.4", features = ["blocking", "json", "stream", "multipart" ] }
rgb = "0.8"
rfd = { version = "0.15", optional = true }
saphyr-parser = { version = "0.0.12", optional = true }
serde = { version = "1.0.152", features = ["derive", "rc"] }
serde_json = "1.0.91"
schemars = "1"
serde_yaml = "0.9.34"
sha1 = { version = "0.10", optional = true }
sha2 = "0.10.7"
similar = { version = "2.7", optional = true }
strsim = { version = "0.11", optional = true }
tera = "1.20.1"
tempfile = "3"
tiny_http = { version = "0.12", optional = true }
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tree-sitter = { version = "0.26", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
webbrowser = { version = "1.2", optional = true }
yaml-edit = { version = "0.3.1", optional = true }
zeroize = { version = "1", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = { version = "0.6", optional = true }
windows = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Registry", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Threading"] }

[dev-dependencies]
jsonschema = { version = "0.57", default-features = false }
tiny_http = "0.12"

[build-dependencies]
winres = "0.1"
time = "0.3"

[package.metadata.winres]
OriginalFilename = "regressify.exe"
LegalCopyright = "Copyright ©Tuyen Pham 2025"
ProductVersion = "1.0.0"
ProductName = "Regressify CLI"
FileDescription = "Regressify CLI"

[profile.release]
# See: https://doc.rust-lang.org/cargo/reference/profiles.html
panic = "abort"   # Terminate the process upon panic
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
strip = true      # Strip symbols from a binary
opt-level = "z"   # Optimize for binary size, but also turn off loop vectorization.
