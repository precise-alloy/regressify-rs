name: Desktop Checks

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'tests/**'
      - 'visual_tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'ci/desktop-smoke.ps1'
      - 'ci/desktop-smoke/**'
      - 'ci/test-desktop-smoke.ps1'
      - '.github/workflows/desktop-checks.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'tests/**'
      - 'visual_tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'ci/desktop-smoke.ps1'
      - 'ci/desktop-smoke/**'
      - 'ci/test-desktop-smoke.ps1'
      - '.github/workflows/desktop-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows Desktop and CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Headless smoke harness checks
        shell: pwsh
        run: ./ci/test-desktop-smoke.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Default CLI regression tests
        run: cargo test --locked --all-targets
      - name: Desktop models and native interaction tests
        run: cargo test --locked --features gui-tests --all-targets
      - name: Production library lint
        run: cargo clippy --locked --features gui --lib -- -D warnings
      - name: Build standalone desktop
        run: cargo build --locked --features gui --bin regressify-desktop

  models:
    name: Linux Headless Models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Headless smoke harness checks
        shell: pwsh
        run: ./ci/test-desktop-smoke.ps1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Shared library and desktop models
        run: cargo test --locked --features desktop --lib
