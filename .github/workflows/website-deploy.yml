name: Deploy website
# Redeploys the website and /mcp from the release the site already serves, so
# docs-only changes ship without an application build or version bump. Tagged
# releases still deploy the site from tuyen-release.yml.
on:
  push:
    branches:
      - master
    paths:
      - 'website/**'
      - 'ci/deploy-cloudflare.sh'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Explicit bash runs steps with -eo pipefail; the implicit default omits pipefail.
defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy website and MCP from the deployed release
    if: github.repository == 'precise-alloy/regressify-rs'
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: https://regressify.eshn.dev
      CLI_ARCHIVE: regressify-cli-x86_64-unknown-linux-gnu.zip
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Reusing the live manifest keeps the update feed unchanged; the website
      # build still validates it (RELEASE_REQUIRED=1).
      - name: Download deployed release manifest
        run: |
          curl --fail --silent --show-error --create-dirs -o "$RUNNER_TEMP/downloads/latest.txt" \
            "$SITE_ORIGIN/downloads/latest.txt"

      # website/mcp-worker is git-ignored and bundled into the same Worker, so
      # every deploy regenerates /mcp with the CLI of the deployed release.
      - name: Read deployed release tag and CLI checksum
        id: release
        run: |
          manifest="$RUNNER_TEMP/downloads/latest.txt"
          tag="$(sed -n 's/^tag=//p' "$manifest" | tr -d '\r')"
          entry="$(awk -F= -v key="archive.$CLI_ARCHIVE" '$1 == key { print $2 }' "$manifest" | tr -d '\r')"
          # Without a tag, gh would silently download GitHub's latest release.
          [ -n "$tag" ] || { echo "error: deployed latest.txt has no tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "cli-sha256=${entry#*:}" >> "$GITHUB_OUTPUT"

      - name: Download the deployed release's Linux CLI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release download "$TAG" --repo precise-alloy/regressify-rs --pattern "$CLI_ARCHIVE" --dir "$RUNNER_TEMP"

      # Only the release pipeline writes the live feed, after verifying every
      # asset, so this ties the zip to those bytes, not just to the asset name.
      - name: Verify the Linux CLI against the deployed feed
        env:
          SHA256: ${{ steps.release.outputs.cli-sha256 }}
        run: echo "${SHA256,,}  $RUNNER_TEMP/$CLI_ARCHIVE" | sha256sum --check --strict

      - name: Extract the Linux CLI
        run: |
          unzip -o -j "$RUNNER_TEMP/$CLI_ARCHIVE" regressify -d "$RUNNER_TEMP/cli"
          chmod +x "$RUNNER_TEMP/cli/regressify"

      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: website/.bun-version

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REGRESSIFY_BIN: ${{ runner.temp }}/cli/regressify
          DOWNLOADS_DIR: ${{ runner.temp }}/downloads
          REGRESSIFY_DISABLE_DIAGNOSTIC_ARCHIVE: 'true'
        run: bash ci/deploy-cloudflare.sh

      - name: Verify update feed is unchanged
        run: |
          curl --fail --silent --show-error -o "$RUNNER_TEMP/live-latest.txt" "$SITE_ORIGIN/downloads/latest.txt"
          cmp "$RUNNER_TEMP/downloads/latest.txt" "$RUNNER_TEMP/live-latest.txt"
