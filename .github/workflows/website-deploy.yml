name: Deploy website
# Redeploys the website and /mcp from the release the site already serves, so
# docs-only changes ship without an application build or version bump. Tagged
# releases still deploy the site from tuyen-release.yml.
on:
  push:
    branches:
      - master
    paths:
      - 'website/**'
      - 'ci/deploy-cloudflare.sh'
      - 'ci/release_feed.py'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Explicit bash runs steps with -eo pipefail; the implicit default omits pipefail.
defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy website and MCP from the deployed release
    if: github.repository == 'precise-alloy/regressify-rs'
    runs-on: ubuntu-latest
    environment:
      name: website-production
      url: https://regressify.eshn.dev
    env:
      SITE_ORIGIN: https://regressify.eshn.dev
      CLI_ARCHIVE: regressify-cli-x86_64-unknown-linux-gnu.zip
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test release selection, publication, and install scripts
        run: |
          python -m pip install PyYAML==6.0.3
          python ci/test-release.py

      # Reusing the live manifest keeps the update feed unchanged; the website
      # build still validates it (RELEASE_REQUIRED=1).
      - name: Download deployed release manifest
        run: |
          curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --connect-timeout 10 --max-time 30 --max-filesize 16384 \
            -H 'Cache-Control: no-cache' --create-dirs \
            -o "$RUNNER_TEMP/downloads/latest.txt" "$SITE_ORIGIN/downloads/latest.txt"

      - name: Read deployed release tag and CLI checksum
        id: release
        run: |
          manifest="$RUNNER_TEMP/downloads/latest.txt"
          tag="$(sed -n 's/^tag=//p' "$manifest" | tr -d '\r')"
          entry="$(awk -F= -v key="archive.$CLI_ARCHIVE" '$1 == key { print $2 }' "$manifest" | tr -d '\r')"
          # Without a validated tag, gh could treat a flag as an option and download GitHub's latest release.
          [[ "$tag" =~ ^v[0-9]{1,4}(\.[0-9]{1,4}){2,3}$ ]] || {
            echo "error: deployed latest.txt has no valid tag" >&2
            exit 1
          }
          [[ "$entry" =~ ^[0-9]+:([0-9a-fA-F]{64})$ ]] || {
            echo "error: deployed latest.txt has no valid $CLI_ARCHIVE checksum" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "cli-sha256=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: release-source
          persist-credentials: false

      - name: Detect legacy release
        id: catalog-source
        run: |
          if [ -f release-source/src/bin/mcp_catalog.rs ]; then
            echo 'legacy=false' >> "$GITHUB_OUTPUT"
          else
            echo 'legacy=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Download the deployed release's Linux CLI
        if: steps.catalog-source.outputs.legacy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release download "$TAG" --repo precise-alloy/regressify-rs --pattern "$CLI_ARCHIVE" --dir "$RUNNER_TEMP"

      # Only the release pipeline writes the live feed, after verifying every
      # asset, so this ties the zip to those bytes, not just to the asset name.
      - name: Verify the Linux CLI against the deployed feed
        if: steps.catalog-source.outputs.legacy == 'true'
        env:
          SHA256: ${{ steps.release.outputs.cli-sha256 }}
        run: echo "${SHA256,,}  $RUNNER_TEMP/$CLI_ARCHIVE" | sha256sum --check --strict

      - name: Extract the Linux CLI
        if: steps.catalog-source.outputs.legacy == 'true'
        run: |
          unzip -o -j "$RUNNER_TEMP/$CLI_ARCHIVE" regressify -d "$RUNNER_TEMP/cli"
          chmod +x "$RUNNER_TEMP/cli/regressify"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build catalog from the deployed release
        run: |
          if [ -f release-source/src/bin/mcp_catalog.rs ]; then
            (cd release-source && cargo run --locked --features mcp-catalog --bin regressify-mcp-catalog) > "$RUNNER_TEMP/mcp-catalog.json"
          else
            # Releases predating the catalog builder only provide the old export.
            "$RUNNER_TEMP/cli/regressify" mcp --output "$RUNNER_TEMP/legacy-mcp"
            cp "$RUNNER_TEMP/legacy-mcp/content/catalog.json" "$RUNNER_TEMP/mcp-catalog.json"
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: website/.bun-version

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MCP_CATALOG: ${{ runner.temp }}/mcp-catalog.json
          DOWNLOADS_DIR: ${{ runner.temp }}/downloads
          REGRESSIFY_DISABLE_DIAGNOSTIC_ARCHIVE: 'true'
        run: bash ci/deploy-cloudflare.sh

      - name: Verify update feed is unchanged
        run: |
          curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --connect-timeout 10 --max-time 30 --max-filesize 16384 \
            --retry 4 --retry-delay 2 -H 'Cache-Control: no-cache' \
            -o "$RUNNER_TEMP/live-latest.txt" "$SITE_ORIGIN/downloads/latest.txt"
          cmp "$RUNNER_TEMP/downloads/latest.txt" "$RUNNER_TEMP/live-latest.txt"
